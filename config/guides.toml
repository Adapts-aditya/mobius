# config/guides.toml
#
# Guide files injected into the Mobius CLI system prompt (not Cursor IDE rules).
# Higher priority numbers are appended **last** so they win on conflicts.

[[candidates]]
path = "AGENTS.md"
priority = 40

[[candidates]]
path = "config/repl_guide.md"
priority = 100

# Optional extras (ignored if missing):
[[candidates]]
path = "INTERNAL_RULES.md"
priority = 90
